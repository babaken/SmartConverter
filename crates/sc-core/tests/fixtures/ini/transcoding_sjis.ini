[Info]
Title=互換テスト用
Description=携帯動画変換君の既定の設定をもとにした、互換テスト用のプリセット

[Item0]
Title=QVGA標準画質15fpsモノラル
Command0=""ffmpeg" -y -i "<%InputFile%>" -vf "scale=320:240:force_original_aspect_ratio=decrease,pad=320:240:(ow-iw)/2:(oh-ih)/2,setsar=1" -r 15000/1001 -c:v mpeg4 -b:v 190k -c:a aac -ac 1 -ar 16000 -b:a 48k -movflags +faststart -f 3gp "<%OutputFile%>.3gp""

[Item1]
Title=QVGA標準画質15fpsステレオ（2 段）
Command0=""ffmpeg" -y -i "<%InputFile%>" -an -vf "scale=320:240:force_original_aspect_ratio=decrease,pad=320:240:(ow-iw)/2:(oh-ih)/2,setsar=1" -r 15000/1001 -c:v mpeg4 -b:v 190k "<%TemporaryFile%>.m4v""
Command1=""ffmpeg" -y -i "<%InputFile%>" -vn -c:a pcm_s16le -ac 2 -ar 16000 -f wav "<%TemporaryFile%>.wav""
Command2=""ffmpeg" -y -i "<%TemporaryFile%>.wav" -c:a aac -b:a 32k "<%TemporaryFile%>.m4a""
Command3=""ffmpeg" -y -i "<%TemporaryFile%>.m4v" -i "<%TemporaryFile%>.m4a" -c copy -movflags +faststart -f 3gp "<%OutputFile%>.3gp""
Command4=cmd /c "del "<%TemporaryFile%>*.*""

[Item2]
Title=QVGA高画質15fpsステレオ
Command0=""ffmpeg" -y -i "<%InputFile%>" -vf "scale=320:240:force_original_aspect_ratio=decrease,pad=320:240:(ow-iw)/2:(oh-ih)/2,setsar=1" -r 15000/1001 -c:v mpeg4 -b:v 400k -c:a aac -ac 2 -ar 16000 -b:a 32k -movflags +faststart -f 3gp "<%OutputFile%>.3gp""

[Item3]
Title=QCIF標準画質15fpsモノラル
Command0=""ffmpeg" -y -i "<%InputFile%>" -vf "scale=176:144:force_original_aspect_ratio=decrease,pad=176:144:(ow-iw)/2:(oh-ih)/2,setsar=1" -r 15000/1001 -c:v mpeg4 -b:v 190k -c:a aac -ac 1 -ar 16000 -b:a 48k -movflags +faststart -f 3gp "<%OutputFile%>.3gp""

[Item4]
Title=QCIF標準画質15fpsステレオ
Command0=""ffmpeg" -y -i "<%InputFile%>" -vf "scale=176:144:force_original_aspect_ratio=decrease,pad=176:144:(ow-iw)/2:(oh-ih)/2,setsar=1" -r 15000/1001 -c:v mpeg4 -b:v 190k -c:a aac -ac 2 -ar 16000 -b:a 32k -movflags +faststart -f 3gp "<%OutputFile%>.3gp""

[Item5]
Title=QCIF高画質15fpsステレオ
Command0=""ffmpeg" -y -i "<%InputFile%>" -vf "scale=176:144:force_original_aspect_ratio=decrease,pad=176:144:(ow-iw)/2:(oh-ih)/2,setsar=1" -r 15000/1001 -c:v mpeg4 -b:v 400k -c:a aac -ac 2 -ar 16000 -b:a 32k -movflags +faststart -f 3gp "<%OutputFile%>.3gp""

[Item6]
Title=音だけ AAC 96kbps
Command0=""ffmpeg" -y -i "<%InputFile%>" -vn -c:a aac -b:a 96k "<%OutputFile%>.m4a""

[Item7]
Title=音だけ Opus 96kbps
Command0=""ffmpeg" -y -i "<%InputFile%>" -vn -c:a libopus -b:a 96k "<%OutputFile%>.opus""

[*テンプ or ゴミ]
; 見出しのない設定の切れ端（本家では、使わない設定をここに置いておくことがある）
Title=VGA標準画質29.97fpsステレオ
Command0=""ffmpeg" -y -i "<%InputFile%>" -vf scale=640:480 -c:v mpeg4 -b:v 768k -c:a aac -b:a 64k "<%OutputFile%>.mp4""

Title=VGA高画質29.97fpsステレオ
Command0=""ffmpeg" -y -i "<%InputFile%>" -vf scale=640:480 -c:v mpeg4 -b:v 1500k -c:a aac -b:a 128k "<%OutputFile%>.mp4""


Command0=""ffmpeg" -y -i "<%InputFile%>" -vn -acodec pcm_s16le -ac 2 -ar 48000 -f wav "<%TemporaryFile%>.wav""

