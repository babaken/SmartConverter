[package]
name = "sc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
# 進捗の行を読むだけなので軽い regex-lite を使う（regex より実行ファイルが約 1 MB 小さい）。
# \d・\s・\w は ASCII だけに一致する（ツールの出力を読むにはそれで足りる）。
regex-lite = "0.1.9"
shell-words = "1.1.1"
thiserror = "2.0.21"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# CP932 の表を作るため（src/sjis.rs）。実行ファイルには入らない。
[build-dependencies]
encoding_rs = "0.8.44"

# src/sjis.rs の結果が encoding_rs と同じかを確かめるため。
[dev-dependencies]
encoding_rs = "0.8.44"
