[package]
name = "sc-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "SmartConverter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# 色と入力ミスの候補は使わない（実行ファイルを小さくする）。エラーの詳しい説明（error-context）は残す。
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# 描画は OpenGL（glow）だけにする。既定の wgpu は起動時に DX12・Vulkan・GL のドライバを
# GPU ごとに読み込み、メモリと実行ファイルの大きさを大きく増やすため。
# links（ブラウザでリンクを開く）と accesskit（画面の読み上げ）は使わないので入れない。
# system_fonts（足りない文字を OS のフォントから探す）は依存が多いので、src/fonts.rs で自分で行う。
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui_extras = "0.37.0"
notify-rust = "4.18.2"
rfd = "0.17.2"
sc-core = { version = "1.0.3", path = "../sc-core" }

[build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem のトレイ（GTK を使わない。D-Bus は zbus で扱う）
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"], optional = true }
# X11（XWayland）でウィンドウを開くため（eframe と同じ版。Wayland ではファイルのドロップを受け取れない）。
# 既定の機能（Wayland のウィンドウの枠など）は、eframe の既定の機能を切ったのでここで入れる。
winit = "0.30.13"
# SIGTERM・SIGHUP で終わるときに、変換中のツールを止める
ctrlc = { version = "3.5.2", features = ["termination"] }

[features]
default = ["tray"]
# Linux のトレイ（Windows では常に有効）
tray = ["dep:ksni"]

[dev-dependencies]
egui_kittest = "0.37.0"
