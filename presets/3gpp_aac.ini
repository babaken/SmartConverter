; SmartConverter のプリセット例（Windows・Linux 共通）
;
; 携帯動画変換君 0.34 の既定の設定「3GPPファイル, 音声AAC形式一般設定」（Transcoding_3GPP_AAC.ini）を、
; 今の ffmpeg だけで同じものを作るように書き直したもの。画面の大きさ・フレームレート・ビットレートは本家と同じ。
;   -fixaspect（縦横比を保って黒帯を足す） → -vf scale=…:force_original_aspect_ratio=decrease,pad=…
;   -s / -r 14.985 / -b 190 / -ab 48       → scale / -r 15000/1001 / -b:v 190k / -b:a 48k
;   QT3GPPFlatten（QuickTime で再生の準備）  → -movflags +faststart
; 使うツール：ffmpeg（PATH に置くか、オプション画面の［ツール］で場所を指定してください）
; 書き方と置換変数の一覧は docs/preset-guide.md を見てください。

[Info]
Title=3GPPファイル, 音声AAC形式一般設定
TitleE=General: 3GPP+AAC General Setting
Description=携帯動画変換君の既定の設定を、今の ffmpeg で書き直したものです（MPEG-4 映像＋AAC 音声の .3gp）。
DescriptionE=The default setting of 3GP Converter, rewritten for current ffmpeg (MPEG-4 video + AAC audio in .3gp).

[Item0]
Title=QVGA標準画質15fpsモノラル
TitleE=QVGA Normal quality 15fps Mono
Command0="ffmpeg -y -i "<%InputFile%>" -vf "scale=320:240:force_original_aspect_ratio=decrease,pad=320:240:(ow-iw)/2:(oh-ih)/2,setsar=1" -r 15000/1001 -c:v mpeg4 -b:v 190k -c:a aac -ac 1 -ar 16000 -b:a 48k -movflags +faststart -f 3gp "<%OutputFile%>.3gp""

[Item1]
Title=QVGA標準画質15fpsステレオ
TitleE=QVGA Normal quality 15fps Stereo
Command0="ffmpeg -y -i "<%InputFile%>" -vf "scale=320:240:force_original_aspect_ratio=decrease,pad=320:240:(ow-iw)/2:(oh-ih)/2,setsar=1" -r 15000/1001 -c:v mpeg4 -b:v 190k -c:a aac -ac 2 -ar 16000 -b:a 32k -movflags +faststart -f 3gp "<%OutputFile%>.3gp""

