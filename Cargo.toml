[workspace]
resolver = "2"
members = ["crates/sc-core", "crates/sc-gui", "crates/sc-cli", "xtask"]
default-members = ["crates/sc-core", "crates/sc-gui", "crates/sc-cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
