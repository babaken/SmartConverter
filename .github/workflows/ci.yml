# main への push と PR で動かす。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 既定ではリポジトリを読むだけにする（リリースを作るジョブだけ書き込みを許す）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux の依存パッケージ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 整形の確認
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy（Linux のトレイなし）
        if: runner.os == 'Linux'
        run: cargo clippy -p sc-gui --all-targets --no-default-features -- -D warnings

      - name: テスト
        run: cargo test --workspace
