# 配布物（Windows の zip、Linux の tar.gz）を作る。
# - 手動実行：配布物を Actions の成果物（artifact）として残し、受け取りと SHA-256 まで確かめる
# アクションは Node.js 24 で動く版を使う（checkout v7、upload-artifact v7、download-artifact v8）。
# - v* のタグを push：配布物を付けたリリースを下書きで作る（公開は GitHub の画面で確かめてから）
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 既定ではリポジトリを読むだけにする（リリースを作るジョブだけ書き込みを許す）。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dist:
    name: dist (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux の依存パッケージ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: テスト
        run: cargo test --workspace --locked

      - name: 配布物を作る
        run: cargo xtask dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # 手動実行でも配布物の受け取りと SHA-256 までは行う（流れ全体を確かめられるように）。
  # 下書きを作るのは v* のタグのときだけ。
  release:
    name: リリースの下書き
    needs: dist
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 下書きを作る
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --title "SmartConverter $GITHUB_REF_NAME" \
            --notes "SmartConverter ${GITHUB_REF_NAME#v} の配布物です。使い方は README を見てください。"
